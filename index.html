    <script>
      // Early suppression of Vite HMR WebSocket connection errors in container environment
      (function() {
        // 1. Mock WebSocket specifically for Vite HMR to prevent "WebSocket closed without opened"
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) {
              isViteHmr = true;
            } else if (Array.isArray(protocols) && protocols.some(function(p) { return String(p).indexOf('vite') !== -1; })) {
              isViteHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('localhost:3000') !== -1)) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var noop = function() {};
              return {
                url: url,
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                send: noop,
                close: noop,
                addEventListener: noop,
                removeEventListener: noop,
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Intercept and silence console.error / console.warn for [vite] and WebSocket
        function isViteWsMessage(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            var str = String((a && a.message) || (a && a.reason) || a || '');
            if (
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1 ||
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite-hmr') !== -1
            ) {
              return true;
            }
          }
          return false;
        }

        var origConsoleError = console.error;
        console.error = function() {
          if (isViteWsMessage(arguments)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          if (isViteWsMessage(arguments)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        // 3. Catch window unhandled rejections and global errors
        window.addEventListener('unhandledrejection', function(event) {
          var msg = String((event && event.reason && (event.reason.message || event.reason)) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = String((event && (event.message || (event.error && event.error.message))) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
